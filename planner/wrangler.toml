name = "crowdcampers-planner"
main = "worker.js"
compatibility_date = "2026-08-01"

routes = [{ pattern = "crowdcampers.com/api/*", zone_name = "crowdcampers.com" }]

[vars]
PLANNER_ENABLED = "true"
PLANNER_MODEL = "claude-haiku-4-5"
DATA_BASE_URL = "https://raw.githubusercontent.com/mineflowprocess/crowdcampers/main"

# Secrets (set with `wrangler secret put`): TURNSTILE_SECRET, ANTHROPIC_API_KEY
# KV: create with `wrangler kv namespace create RATE_KV` and paste the id below.
[[kv_namespaces]]
binding = "RATE_KV"
id = "REPLACE_WITH_KV_ID"
